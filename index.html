<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacks Invoice Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@stacks/stacking@2.0.0/dist/stacks.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="https://cdn.walletconnect.org/walletconnect.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Stacks Invoice Generator</h1>
        <p>Create and share invoices in STX or sBTC easily</p>

        <form id="invoice-form">
            <label for="token">Choose Token:</label>
            <select id="token" required>
                <option value="stx">STX</option>
                <option value="sbtc">sBTC</option>
            </select>

            <label for="amount">Amount:</label>
            <input type="text" id="amount" placeholder="Enter amount" required 
                   pattern="[0-9]+([.,][0-9]+)?" inputmode="decimal">

            <label for="description">Description:</label>
            <input type="text" id="description" placeholder="What is this for?" required>

            <label for="stacks-address">Stacks Address:</label>
            <input type="text" id="stacks-address" placeholder="Your Stacks address" required>

            <button type="submit" id="generate-invoice">Generate Invoice</button>
        </form>

        <div id="invoice-container" style="display: none;">
            <canvas id="invoice-canvas"></canvas>

            <!-- Contenedor de botones -->
            <div class="buttons-container">
                <button id="pay-now">Pay Now</button>
                <button id="download-invoice">Download Invoice</button>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2025 Stacks Invoice Generator by flor.btc</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
